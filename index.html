<script>
var K='lawoffice-v1',tab='dash',q='';
var db={clients:[],cases:[],sessions:[],tasks:[],notices:[],accounts:[]};
try{var s=localStorage.getItem(K);if(s)db=Object.assign(db,JSON.parse(s))}catch(e){}
function save(){if(window.pushDb)window.pushDb(db)}
var $=function(x){return document.querySelector(x)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var today=function(){var d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
var addDays=function(n){var d=new Date(today()+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
var find=function(t,id){return db[t].find(function(x){return x.id===id})};
var nm=function(t,id){var r=find(t,id);return r?esc(r.title||r.name||r.number):'—'};
var TABS=[['dash','الرئيسية'],['clients','العملاء'],['cases','القضايا'],['sessions','الجلسات'],['tasks','المهام'],['notices','الإعلانات'],['accounts','حسابات العملاء']];
var T={clients:'عميل',cases:'قضية',sessions:'جلسة',tasks:'مهمة',notices:'إعلان',accounts:'حركة حساب'};
var F={
 clients:[['name','الاسم','text'],['phone','الهاتف','text'],['address','العنوان','text'],['notes','ملاحظات','area']],
 cases:[['number','رقم القضية','text'],['title','عنوان القضية','text'],['clientId','العميل','clients'],['opponent','الخصم','text'],['court','المحكمة','text'],['status','الحالة','select:مفتوحة,مغلقة']],
 sessions:[['date','التاريخ','date'],['time','الوقت','time'],['clientId','الموكل','clients'],['caseId','القضية','cases'],['type','النوع','select:جلسة,مرافعة,خبرة,نطق بالحكم,أخرى'],['decision','القرار','area'],['nextDate','اتأجلت لجلسة (تاريخ)','date'],['notes','ملاحظات','area']],

};
F.notices=[['date','تاريخ الإعلان','date'],['caseId','القضية','cases'],['type','نوع الإعلان','select:صحيفة دعوى,إنذار,إعلان جلسة,حكم,أخرى'],['bailiff','اسم المحضر','text'],['office','مكتب المحضرين','text'],['handed','تاريخ التسليم للمحضر','date'],['status','الحالة','select:تم الإعلان,لم يتم بعد,مرتجع'],['notes','ملاحظات','area']];
F.accounts=[['date','التاريخ','date'],['clientId','العميل','clients'],['caseId','القضية (اختياري)','cases'],['kind','البند','select:أتعاب متفق عليها,دفعة من العميل,مصروفات,أتعاب إضافية'],['amount','المبلغ','number'],['notes','ملاحظات','area']];

  var pv=s.prevId?'<div class=mut>جاية من جلسة '+esc(s.prevDate)+' — القرار: '+esc(s.prevDecision||'—')+'</div>':'';

 return '<div class=c><b>عدد العملاء:</b> '+db.clients.length+' — <b>القضايا المفتوحة:</b> '+op+'</div>'
 +'<div class=bar><button class=pr onclick="bkXlsx()">حفظ نسخة إكسيل</button><button class=w onclick="pickImp()">استرجاع من إكسيل</button><button onclick="waOpen()">إرسال شغل بكرة على واتس</button></div>'
 +'<h3>الجلسات القادمة (15 يوم)</h3>'+(up.map(card).join('')||'<p class=mut>لا توجد جلسات قادمة.</p>')
 +'<h3>مهام متأخرة أو مستحقة اليوم</h3>'+(tk.map(function(t){return '<div class=al>'+esc(t.title)+' — '+esc(t.due)+'</div>'}).join('')||'<p class=mut>لا توجد مهام متأخرة.</p>');
}
function list(t){
 var C=COL[t];

function caseOpts(cid,sel){return '<option value="">— اختر القضية —</option>'+db.cases.filter(function(c){return c.clientId===cid}).map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?' selected':'')+'>'+esc(c.title||c.number)+'</option>'}).join('')}

function openForm(t,id){
 var r=id?Object.assign({},find(t,id)):{};
 if(t==='sessions'&&!r.clientId&&r.caseId){var cc=find('cases',r.caseId);if(cc)r.clientId=cc.clientId}

 F[t].forEach(function(f){
   var k=f[0],ty=f[2],v=r[k]==null?(DEF[k]||''):r[k],inp;
   if(ty==='area')inp='<textarea id=f_'+k+'>'+esc(v)+'</textarea>';
   else if(ty.indexOf('select:')===0)inp='<select id=f_'+k+'>'+ty.slice(7).split(',').map(function(o){return '<option'+(o===v?' selected':'')+'>'+o+'</option>'}).join('')+'</select>';
   else if(t==='sessions'&&k==='caseId'){inp='<select id=f_caseId>'+caseOpts(r.clientId||'',v)+'</select>'}
   else if(t==='sessions'&&k==='clientId'){inp='<select id=f_clientId onchange="refreshCases()"><option value="">— اختر الموكل —</option>'+db.clients.map(function(x){return '<option value="'+x.id+'"'+(x.id===v?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>'}
   else if(ty==='clients'||ty==='cases'){var opts=db[ty].map(function(x){return '<option value="'+x.id+'"'+(x.id===v?' selected':'')+'>'+esc(x.name||x.title)+'</option>'}).join('');inp='<select id=f_'+k+'><option value="">— اختر —</option>'+opts+'</select>'}
   else inp='<input id=f_'+k+' type='+ty+' value="'+esc(v)+'">';
   h+='<label>'+f[1]+inp+'</label>';
 });
 modal(h+'<div class=bar><button class=pr onclick="submit(\''+t+'\',\''+(id||'')+'\')">حفظ</button><button onclick="closeM()">إلغاء</button></div>');
}
function submit(t,id){
 var o={};F[t].forEach(function(f){o[f[0]]=$('#f_'+f[0]).value.trim()});
 if(!o[F[t][0][0]])return notify('الحقل الأول مطلوب');
 var rec=id?Object.assign(find(t,id),o):Object.assign({id:uid()},o);if(!id)db[t].push(rec);if(t==='sessions')carry(rec);
 save();closeM();render();notify('تم الحفظ');
}
function del(t,id){
 ask('تأكيد حذف السجل؟',function(){db[t]=db[t].filter(function(x){return x.id!==id});save();render();notify('تم الحذف')});
}
function carry(s){
 if(!s.nextDate)return;
 var ch=s.nextId?find('sessions',s.nextId):null;
 if(ch){ch.date=s.nextDate;ch.caseId=s.caseId;ch.clientId=s.clientId;ch.prevDate=s.date;ch.prevDecision=s.decision||'';ch.prevId=s.id;return}
 ch={id:uid(),date:s.nextDate,time:'',clientId:s.clientId,caseId:s.caseId,type:'جلسة',decision:'',nextDate:'',notes:'مؤجلة تلقائيًا من جلسة '+s.date,prevDate:s.date,prevDecision:s.decision||'',prevId:s.id,demo:!!s.demo};
 s.nextId=ch.id;db.sessions.push(ch);save();
}
function seed(){
 if(db.clients.some(function(x){return x.demo}))return notify('البيانات التجريبية موجودة');
 var D=addDays;
 function ses(o){var s=Object.assign({id:uid(),time:'10:00',type:'جلسة',decision:'',nextDate:'',notes:'',demo:true},o);db.sessions.push(s);carry(s);return s}
 function chainOf(o,steps){var s=ses(o),cur=s;steps.forEach(function(st){var ch=find('sessions',cur.nextId);if(!ch)return;ch.decision=st[0];ch.nextDate=st[1];ch.time=st[2];ch.type=st[3];ch.notes=st[4];if(ch.nextDate)carry(ch);cur=ch});return s}

 ].forEach(function(c){db.cases.push({id:c[0],number:c[1],title:c[2],clientId:c[3],opponent:c[4],court:c[5],status:c[6],demo:true})});
 chainOf({date:D(-20),time:'10:00',clientId:'d1',caseId:'dc1',type:'جلسة',decision:'تأجيل لتقديم المستندات',nextDate:D(3),notes:'حضر الموكل وقدم بعض المستندات'},
  [['تأجيل للاطلاع على رد الخصم',D(14),'11:00','مرافعة','الخصم لم يرد بعد'],['حجز الدعوى للحكم','','10:30','نطق بالحكم','']]);

  ['dt4','تسليم صورة الحكم للعميل',D(-10),'dc5','موظف الاستقبال','نعم']

async function impBk(file){
 var out={clients:[],cases:[],sessions:[],tasks:[],notices:[],accounts:[]};
 try{
  var z=await JSZip.loadAsync(await file.arrayBuffer()),dp=new DOMParser();
  var wb=dp.parseFromString(await z.file('xl/workbook.xml').async('string'),'application/xml');
  var rl=dp.parseFromString(await z.file('xl/_rels/workbook.xml.rels').async('string'),'application/xml'),map={};
  Array.from(rl.getElementsByTagName('Relationship')).forEach(function(r){map[r.getAttribute('Id')]=r.getAttribute('Target')});
  var sh=Array.from(wb.getElementsByTagName('sheet'));
  for(var i=0;i<sh.length;i++){
   var sn=sh[i].getAttribute('name');if(!(sn in out))continue;
   var sx=dp.parseFromString(await z.file('xl/'+map[sh[i].getAttribute('r:id')]).async('string'),'application/xml');
   var grid=Array.from(sx.getElementsByTagName('row')).map(function(r){var a=[];Array.from(r.getElementsByTagName('c')).forEach(function(c){var L=c.getAttribute('r').replace(/[0-9]/g,''),ci=0;for(var j=0;j<L.length;j++)ci=ci*26+L.charCodeAt(j)-64;var v='',te=c.getElementsByTagName('t')[0],ve=c.getElementsByTagName('v')[0];if(te)v=te.textContent;else if(ve)v=+ve.textContent;a[ci-1]=v});return a});
   var hd=grid[0]||[];
   out[sn]=grid.slice(1).map(function(row){var o={};hd.forEach(function(h,j){if(h)o[h]=row[j]===undefined?'':row[j]});return o}).filter(function(o){return o.id});
  }
 }catch(e){return null}
 return out;
}
